
[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "quassar-data"
version = "0.1.0"
description = "Financial data engineering, validation, temporal integrity, and reproducible quantitative research."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Quassar Capital" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1"
]

[tool.hatch.build.targets.wheel]
packages = ["src/quassar_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "UP"
]
